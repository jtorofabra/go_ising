# Self-play de KataGo en 9×9 para generar las partidas.
# katago match -config match.cfg -log-file match.log -sgf-output-dir partidas_9x9/

logSearchInfo = false
logMoves = false
logGamesEvery = 1
logToStdout = true

# dos bots idénticos (con numBots = 1 falla con "no matchups specified")
numBots = 2
botName0 = A
botName1 = B
nnModelFile = red.bin.gz

numGameThreads = 32
numGamesTotal = 10000
maxMovesPerGame = 250
allowResignation = false
resignThreshold = -0.95  # KataGo las pide aunque no se abandone
resignConsecTurns = 6

# conteo por área, komi fijo 7,5
koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = false
hasButtons = false
bSizes = 9
bSizeRelProbs = 100
komiAuto = False
komiMean = 7.5
handicapProb = 0.0
handicapCompensateKomiProb = 1.0

maxVisits = 50
numSearchThreads = 1
chosenMoveTemperatureEarly = 0.60
chosenMoveTemperature = 0.20

nnMaxBatchSize = 32
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true
numNNServerThreadsPerModel = 1
